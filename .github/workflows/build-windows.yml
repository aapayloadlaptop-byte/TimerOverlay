
name: Build FPV Timer Overlay

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python on build computer
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FPV_Timer_Overlay fpv_timer_overlay.py

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-temp
          $f = Get-ChildItem ffmpeg-temp -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          Copy-Item $f.FullName dist/ffmpeg.exe

      - name: Package application
        run: Compress-Archive -Path dist/FPV_Timer_Overlay.exe,dist/ffmpeg.exe -DestinationPath FPV_Timer_Overlay_Windows.zip

      - name: Upload finished application
        uses: actions/upload-artifact@v4
        with:
          name: FPV_Timer_Overlay_Windows
          path: FPV_Timer_Overlay_Windows.zip
          retention-days: 14
